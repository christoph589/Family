<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Famelio – der Familienplaner</title>
    <meta name="description" content="Famelio bringt Termine, Aufgaben, Taschengeld, Stundenplan und Essen der ganzen Familie auf einen Bildschirm. Läuft im Browser auf euren vorhandenen Geräten." />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* iPhone als Home-Screen-App: Höhe an den echten Bildschirm koppeln, nicht an 100 % (das bleibt nach der Tastatur manchmal zu klein) */
      @supports (height: 100dvh) { html, body { height: 100dvh; } }
      #root { position: fixed; top: 0; left: 0; right: 0; bottom: 0; height: auto; }
    </style>
    <link rel="manifest" href="/Family/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/Family/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Famelio" />
    <meta name="theme-color" content="#5b4cf0" />
    <script>
      // iOS: Nach dem Schließen der Tastatur bleibt die Seite in der Home-Screen-App sonst verschoben oder zu kurz.
      (function () {
        var fix = function () { setTimeout(function () { window.scrollTo(0, 0); }, 50); };
        document.addEventListener('focusout', fix);
        window.addEventListener('orientationchange', fix);
        window.addEventListener('pageshow', fix);
      })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
</body>
</html>
