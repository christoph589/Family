<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>Famelio – der Familienplaner</title>
    <meta name="description" content="Famelio bringt Termine, Aufgaben, Taschengeld, Stundenplan und Essen der ganzen Familie auf einen Bildschirm. Läuft im Browser auf euren vorhandenen Geräten." />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* iPhone als Home-Screen-App: Höhe an den echten Bildschirm koppeln, nicht an 100 % (das bleibt nach der Tastatur manchmal zu klein) */
      @supports (height: 100dvh) { html, body { height: 100dvh; } }
      #root { position: fixed; top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); height: auto; }
    </style>
    <link rel="manifest" href="/Family/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/Family/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Famelio" />
    <meta name="theme-color" content="#5b4cf0" />
    <script>
      // iOS: Nach dem Schließen der Tastatur bleibt die Seite in der Home-Screen-App sonst verschoben oder zu kurz.
      (function () {
        var fix = function () { setTimeout(function () { window.scrollTo(0, 0); }, 50); };
        document.addEventListener('focusout', fix);
        window.addEventListener('orientationchange', fix);
        window.addEventListener('pageshow', fix);
      })();
    </script>
    <script>
      /* Neue Version automatisch laden: beim Start und wenn die App wieder in den Vordergrund kommt,
         wird index.html ohne Cache geholt. Hat sich das App-Bündel geändert, lädt die Seite neu. */
      (function () {
        var mine = function () { var s = document.querySelector('script[src*="/_expo/static/js/web/"]'); return s ? s.getAttribute('src').split('/').pop() : ''; };
        var busy = false;
        function check() {
          if (busy || !window.fetch) return; busy = true;
          fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (html) {
            busy = false;
            var m = /_expo\/static\/js\/web\/([^"']+\.js)/.exec(html || ''), cur = mine();
            if (m && cur && m[1] !== cur) {
              var a = document.activeElement; if (a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) return;
              location.reload();
            }
          }).catch(function () { busy = false; });
        }
        window.addEventListener('load', function () { setTimeout(check, 1500); });
        document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
        window.addEventListener('pageshow', function (e) { if (e.persisted) check(); });
      })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
</body>
</html>
